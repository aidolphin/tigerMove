<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f"/>
      <stop offset="25%" stop-color="#fcf6ba"/>
      <stop offset="50%" stop-color="#b38728"/>
      <stop offset="75%" stop-color="#fbf5b7"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6e2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="#0f1a14"/>
  <rect width="512" height="512" rx="112" fill="url(#gold)" opacity="0.08"/>
  
  <g filter="url(#shadow)">
    <path d="M256 88 L328 176 L408 184 L352 256 L368 344 L256 304 L144 344 L160 256 L104 184 L184 176 Z" 
          fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4"/>
  </g>
  
  <g transform="translate(256,256)">
    <g filter="url(#innerGlow)">
      <polygon points="0,-120 35,-35 120,0 35,35 0,120 -35,35 -120,0 -35,-35" 
               fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.6"/>
    </g>
    <g>
      <polygon points="0,-90 26,-26 90,0 26,26 0,90 -26,26 -90,0 -26,-26" 
               fill="url(#gold)" opacity="0.15"/>
    </g>
    <polygon points="0,-72 21,-21 72,0 21,21 0,72 -21,21 -72,0 -21,-21" 
             fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>
    <circle cx="0" cy="0" r="28" fill="url(#gold)" opacity="0.9"/>
    <circle cx="0" cy="0" r="18" fill="#0f1a14"/>
    <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
  </g>
  
  <g opacity="0.5">
    <path d="M256 64 L256 96 M256 416 L256 448 M64 256 L96 256 M416 256 L448 256" 
          stroke="url(#gold)" stroke-width="1.5"/>
  </g>
  
  <g opacity="0.35">
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="0.75"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="0.5" stroke-dasharray="8 12"/>
  </g>
  
  <g transform="translate(256,140)">
    <path d="M-40 0 L-20 -8 L0 0 L20 -8 L40 0 L20 8 L0 0 L-20 8 Z" 
          fill="url(#gold)" opacity="0.7"/>
  </g>
  <g transform="translate(256,372)">
    <path d="M-40 0 L-20 -8 L0 0 L20 -8 L40 0 L20 8 L0 0 L-20 8 Z" 
          fill="url(#gold)" opacity="0.7" transform="rotate(180)"/>
  </g>
