<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TigerMove | Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eaf5ef;
        color: #17211b;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      }
      .card {
        text-align: center;
        padding: 32px;
        border: 1px solid #bed9c9;
        border-radius: 16px;
        background: #f7fffaee;
        box-shadow: 0 10px 28px #2347352e;
        max-width: min(100%, 360px);
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, serif;
        font-size: 22px;
        color: #183f2b;
      }
      p {
        margin: 0;
        color: #6f7c71;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 18px;
        padding: 10px 16px;
        border: 1px solid #183f2b;
        border-radius: 10px;
        background: #183f2b;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>TigerMove needs an internet connection for online matches, but local play is available when you're back online.</p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
